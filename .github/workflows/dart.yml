name: Flutter CI (Dart)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        flutter-channel: [stable, beta] # Changed matrix variable name for clarity
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }} # Uses 'channel' for stable/beta

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/pub
          key: ${{ runner.os }}-pub-${{ matrix.flutter-channel }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.flutter-channel }}-

      - name: Cache Gradle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache CocoaPods
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed . # Corrected from flutter format

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos # Moved flag here

      - name: Run tests
        run: flutter test # Removed invalid flag

      - name: Build Android (APK)
        if: matrix.os == 'ubuntu-latest' # Optimized to only build Android on Ubuntu
        run: flutter build apk --release

      - name: Upload Android APK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.flutter-channel }}-${{ matrix.os }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Ensure CocoaPods is available
        if: matrix.os == 'macos-latest'
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi

      - name: Build iOS (no codesign)
        if: matrix.os == 'macos-latest'
        run: |
          flutter build ios --no-codesign --release

      - name: Upload iOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts-${{ matrix.flutter-channel }}
          path: |
            build/ios/ipa/**/*.ipa
            build/ios/iphoneos/**/*.app