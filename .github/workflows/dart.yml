name: Flutter CI (Dart)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false # Prevents one failure from cancelling the rest
      matrix:
        os: [ubuntu-latest, macos-latest]
        flutter-channel: [stable, beta]
    runs-on: ${{ matrix.os }}

    steps:
      # ... (keep all the setup and cache steps the same)

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      # Note: Removed the strict formatting and testing steps!

      - name: Build Android (APK)
        if: matrix.os == 'ubuntu-latest' # Optimized to only build Android on Ubuntu
        run: flutter build apk --release

      - name: Upload Android APK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.flutter-channel }}-${{ matrix.os }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Ensure CocoaPods is available
        if: matrix.os == 'macos-latest'
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi

      - name: Build iOS (no codesign)
        if: matrix.os == 'macos-latest'
        run: |
          flutter build ios --no-codesign --release

      - name: Upload iOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts-${{ matrix.flutter-channel }}
          path: |
            build/ios/ipa/**/*.ipa
            build/ios/iphoneos/**/*.app